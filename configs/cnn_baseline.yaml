pretrained_backbone: true   # MobileNetV3-Small preentrenado en ImageNet

# Detector denso tipo RetinaNet: backbone MobileNetV3-Small + FPN P2-P5 + head
# con anchors (ver models/cnn_baseline/).
training:
  # Techo de épocas; manda el early stopping.
  epochs: 100
  # 640 px: sube el objeto mediano de 16 a 25 px respecto a 416 y la cobertura
  # de anchors del 88.5 % al 90.7 %.
  img_size: 640
  # Con P2 hay 363 840 anchors a 640 px. Medido en la RTX 5070 (8 GB) con la
  # DetectionLoss real:
  #   batch 16 -> 11.50 GB  desborda a RAM del sistema, 99 min/época
  #   batch  8 ->  5.85 GB  5.1 min/época
  batch_size: 8
  optimizer: AdamW
  lr: 0.001
  weight_decay: 0.0001
  lr_scheduler: cosine
  amp: true
  # Clipping de gradiente: un pico en un solo lote con focal loss + fp16 + P2
  # llevó a NaN un entrenamiento anterior. SSD usa el mismo valor.
  grad_clip: 10.0
