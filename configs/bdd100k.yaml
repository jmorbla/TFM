# Configuración del dataset BDD100K
# Ajustar las rutas a donde estén los datos

dataset:
  name: bdd100k
  # Raíz de las imágenes — subcarpetas train/ val/ test/
  images_dir: bdd100k_images_100k/100k
  # Raíz de las etiquetas en formato YOLO que escribe data/prepare_bdd100k.py
  # (subcarpetas train/ val/ test/; 8000 / 2000 / 2000 imágenes, semilla 42)
  labels_dir: bdd100k_labels_yolo
  # Etiquetas JSON originales de BDD100K, una por imagen — subcarpetas train/ val/ test/
  ann_dir: bdd100k_labels/100k

  # Clases (mismo orden que el benchmark de detección de BDD100K)
  names:
    0: person
    1: rider
    2: car
    3: truck
    4: bus
    5: train
    6: motor
    7: bike
    8: traffic light
    9: traffic sign
  nc: 10

training:
  pin_memory: true
