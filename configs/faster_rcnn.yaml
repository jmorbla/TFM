pretrained: true          # pesos COCO de torchvision (resnet50_fpn_v2)

training:
  # Techo de épocas; manda el early stopping.
  epochs: 60
  img_size: 800           # informativo: lado corto; el lado largo se limita a 1333
  batch_size: 4
  optimizer: SGD
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  lr_scheduler: cosine
  amp: true
