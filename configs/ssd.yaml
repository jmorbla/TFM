model: ssd
variant: ssd300_vgg16     # torchvision: ssd300_vgg16 | ssdlite320_mobilenet_v3_large
pretrained: true

training:
  # Techo, no objetivo. En el run de 30 épocas el último cuarto solo ganaba un
  # 4.9 %: prácticamente en meseta. Como cuesta 2 min/época (el 3 % del
  # presupuesto total) damos margen amplio y que pare el early stopping.
  epochs: 60
  img_size: 300
  batch_size: 8
  optimizer: SGD
  lr: 0.001          # 0.01 causaba NaN desde epoch 1 (LR demasiado alto para fine-tuning)
  momentum: 0.9
  weight_decay: 0.0005
  lr_scheduler: cosine
  amp: true
  grad_clip: 10.0    # clipping estándar para SSD (evita explosión de gradientes residual)

inference:
  score_threshold: 0.02
  nms_threshold: 0.45
  detections_per_img: 200
