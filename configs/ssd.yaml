pretrained: true          # pesos COCO de torchvision (ssd300_vgg16)

training:
  # Techo de épocas; manda el early stopping.
  epochs: 60
  img_size: 300           # informativo: la entrada es siempre 300x300
  batch_size: 8
  optimizer: SGD
  lr: 0.001          # 0.01 causaba NaN desde la época 1
  momentum: 0.9
  weight_decay: 0.0005
  lr_scheduler: cosine
  amp: true
  grad_clip: 10.0
