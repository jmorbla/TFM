# ─────────────────────────────────────────────────────────────────────
# GENERADO AUTOMÁTICAMENTE — Fase 1 (tuning de learning rate)
# Variante: base  ·  lr = 0.0001
# Épocas reducidas a 30: esta fase sirve para ORDENAR learning rates,
# no para converger. No usar estos YAML para los runs finales.
# Base: configs/detr.yaml
# ─────────────────────────────────────────────────────────────────────
model: detr
variant: facebook/detr-resnet-50   # HuggingFace model id
pretrained: true

training:
  # Techo, no objetivo. En el run de 50 épocas la pérdida aún bajaba un 16.3 %
  # en el último cuarto: claramente infraentrenado. Lo ideal serían 150+, pero
  # DETR cuesta 15.2 min/época y ya se lleva el 50 % del presupuesto de GPU.
  # AVISO: si el early stopping NO salta antes de la 100, el techo está
  # limitando el resultado y hay que declararlo en la memoria.
  epochs: 30
  img_size: 800
  batch_size: 4
  optimizer: AdamW
  lr_backbone: 0.00001
  lr: 0.0001
  weight_decay: 0.0001
  lr_scheduler: step
  lr_drop: 24             # escalado al nuevo techo (era 40 para 50 épocas)
  amp: true
  clip_max_norm: 0.1

  # DETR needs many epochs to converge; consider gradient checkpointing
  gradient_checkpointing: false

inference:
  score_threshold: 0.5
  num_queries: 100        # object queries
