model: cnn_gru
# Hybrid CNN+GRU: processes sequences of T consecutive video frames
backbone: mobilenet_v3_small
pretrained_backbone: true

sequence:
  T: 4                    # frames per sequence
  stride: 2               # frame sampling stride within BDD100K videos

gru:
  hidden_size: 256
  num_layers: 1
  bidirectional: true
  dropout: 0.1

training:
  epochs: 30
  img_size: 416
  batch_size: 8           # effective: 8 sequences × 4 frames
  optimizer: AdamW
  lr: 0.0005
  weight_decay: 0.0001
  lr_scheduler: cosine
  amp: true
